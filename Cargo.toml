[package]
name = "wezurrection"
version = "0.2.0"
edition = "2021"
description = "Save and resurrect WezTerm sessions on macOS"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
url = "2"
